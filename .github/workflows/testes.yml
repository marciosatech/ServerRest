name: Testes automatizados

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      tipo_teste:
        description: 'Escolha o conjunto de testes que será executado'
        required: true
        default: todos
        type: choice
        options:
          - api
          - e2e
          - todos

# Necessario para publicar o relatorio Allure na branch gh-pages.
permissions:
  contents: write

# Evita que duas execucoes publiquem o relatorio ao mesmo tempo e percam historico.
concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: false

jobs:
  executar-testes:
    name: Executar testes ${{ inputs.tipo_teste || 'todos' }}
    runs-on: ubuntu-latest

    env:
      LOGIN_EMAIL: ${{ secrets.LOGIN_EMAIL }}
      LOGIN_PASSWORD: ${{ secrets.LOGIN_PASSWORD }}

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Instalar navegador do Playwright
        if: ${{ inputs.tipo_teste != 'api' }}
        run: npx playwright install --with-deps chromium

      - name: Validar tipos TypeScript
        run: npm run verificar:tipos

      - name: Executar testes selecionados
        id: executar-testes
        continue-on-error: true
        shell: bash
        run: |
          set +e
          tipo_teste="${{ inputs.tipo_teste || 'todos' }}"

          case "$tipo_teste" in
            api)
              npm run test:api
              ;;
            e2e)
              npm run test:e2e
              ;;
            todos)
              npm test
              ;;
            *)
              echo "Tipo de teste inválido: $tipo_teste"
              codigo_saida=1
              ;;
          esac

          if [ -z "${codigo_saida+x}" ]; then
            codigo_saida=$?
          fi
          echo "codigo_saida=$codigo_saida" >> "$GITHUB_OUTPUT"

      - name: Gerar resumo da execução
        if: ${{ always() }}
        run: npm run gerar:resumo

      - name: Recuperar histórico do Allure
        if: ${{ always() }}
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Gerar relatório Allure
        if: ${{ always() }}
        shell: bash
        run: |
          mkdir -p allure-results

          # O historico da ultima publicacao alimenta os graficos de tendencia e o historico de cada teste.
          if [ -d gh-pages/history ]; then
            cp -r gh-pages/history allure-results/history
          fi

          cat > allure-results/executor.json <<EOF
          {
            "name": "GitHub Actions",
            "type": "github",
            "buildOrder": ${{ github.run_number }},
            "buildName": "Execução #${{ github.run_number }} (${{ inputs.tipo_teste || 'todos' }})",
            "buildUrl": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "reportUrl": "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/",
            "reportName": "ServeRest - Automação de testes"
          }
          EOF

          npm run allure:gerar

      - name: Publicar relatório Allure no GitHub Pages
        # Publica apenas a suite completa da main, para o historico nao misturar execucoes parciais ou de PR.
        if: ${{ always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && (inputs.tipo_teste || 'todos') == 'todos' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report
          commit_message: 'Relatório Allure da execução #${{ github.run_number }}'

      - name: Adicionar link do Allure ao resumo
        if: ${{ always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && (inputs.tipo_teste || 'todos') == 'todos' }}
        shell: bash
        run: |
          echo "📊 **Relatório Allure:** https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/ (pode levar 1-2 minutos para atualizar)" >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar relatório e evidências
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-${{ inputs.tipo_teste || 'todos' }}
          path: |
            playwright-report/
            allure-report/
            test-results/
          if-no-files-found: ignore

      - name: Falhar job se os testes falharem
        if: ${{ always() && steps.executar-testes.outputs.codigo_saida != '0' }}
        run: exit 1
