name: Testes automatizados

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      tipo_teste:
        description: 'Escolha o conjunto de testes que será executado'
        required: true
        default: todos
        type: choice
        options:
          - api
          - e2e
          - todos

# Permissao minima por padrao; cada job pede apenas o que precisa.
permissions:
  contents: read

concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: 24
  TIPO_TESTE: ${{ inputs.tipo_teste || 'todos' }}

jobs:
  validar:
    name: 🔎 Validar código
    runs-on: ubuntu-24.04

    outputs:
      camadas: ${{ steps.camadas.outputs.camadas }}

    steps:
      - name: Baixar código
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Validar tipos TypeScript
        run: npm run verificar:tipos

      - name: Testar scripts de relatório
        run: npm run test:scripts

      - name: Definir camadas de teste
        id: camadas
        shell: bash
        run: |
          case "$TIPO_TESTE" in
            api) camadas='["api"]' ;;
            e2e) camadas='["e2e"]' ;;
            todos) camadas='["api","e2e"]' ;;
            *) echo "Tipo de teste inválido: $TIPO_TESTE"; exit 1 ;;
          esac
          echo "camadas=$camadas" >> "$GITHUB_OUTPUT"

  testes:
    name: 🧪 Testes ${{ matrix.camada == 'api' && 'API' || 'E2E' }}
    needs: validar
    runs-on: ubuntu-24.04

    strategy:
      # Uma camada falhando nao interrompe a outra; o relatorio mostra as duas.
      fail-fast: false
      matrix:
        camada: ${{ fromJSON(needs.validar.outputs.camadas) }}

    env:
      CAMADA_TESTE: ${{ matrix.camada }}
      LOGIN_EMAIL: ${{ secrets.LOGIN_EMAIL }}
      LOGIN_PASSWORD: ${{ secrets.LOGIN_PASSWORD }}

    steps:
      - name: Baixar código
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Instalar navegador do Playwright
        if: ${{ matrix.camada == 'e2e' }}
        run: npx playwright install --with-deps chromium

      - name: Executar testes
        run: npx playwright test tests/${{ matrix.camada }}

      - name: Salvar relatório do Playwright
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: blob-${{ matrix.camada }}
          path: blob-report/
          retention-days: 1
          if-no-files-found: ignore

      - name: Salvar resultados do Allure
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-${{ matrix.camada }}
          path: allure-results/
          retention-days: 1
          if-no-files-found: ignore

  relatorios:
    name: 📊 Gerar relatórios
    needs: [validar, testes]
    # Roda mesmo com testes falhando: o relatorio e justamente onde as falhas sao analisadas.
    if: ${{ !cancelled() && needs.validar.result == 'success' }}
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      pages: read
      actions: write

    outputs:
      publicar: ${{ steps.preparar-publicacao.outputs.publicar }}

    steps:
      - name: Baixar código
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Baixar relatórios do Playwright
        uses: actions/download-artifact@v8
        with:
          pattern: blob-*
          path: todos-blobs
          merge-multiple: true

      - name: Baixar resultados do Allure
        uses: actions/download-artifact@v8
        with:
          pattern: allure-results-*
          path: allure-results
          merge-multiple: true

      - name: Unificar relatório do Playwright
        run: npx playwright merge-reports --config playwright.merge.config.ts todos-blobs

      - name: Gerar resumo da execução
        run: npm run gerar:resumo

      - name: Obter endereço do GitHub Pages
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v6

      - name: Gerar relatório Allure
        shell: bash
        env:
          URL_RELATORIO: ${{ steps.pages.outputs.base_url }}
        run: |
          mkdir -p allure-results/history

          # O historico vem do proprio relatorio publicado e alimenta as tendencias e o historico de cada teste.
          if [ -n "$URL_RELATORIO" ]; then
            for arquivo in history.json history-trend.json duration-trend.json categories-trend.json retry-trend.json; do
              curl -sfL "$URL_RELATORIO/history/$arquivo" -o "allure-results/history/$arquivo" \
                || echo "Histórico $arquivo ainda não publicado."
            done
          fi

          cat > allure-results/executor.json <<EOF
          {
            "name": "GitHub Actions",
            "type": "github",
            "buildOrder": ${{ github.run_number }},
            "buildName": "Execução #${{ github.run_number }} ($TIPO_TESTE)",
            "buildUrl": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "reportUrl": "$URL_RELATORIO/",
            "reportName": "ServeRest - Automação de testes"
          }
          EOF

          npm run allure:gerar

      - name: Salvar relatórios
        uses: actions/upload-artifact@v7
        with:
          name: relatorios-${{ env.TIPO_TESTE }}
          path: |
            playwright-report/
            allure-report/
          if-no-files-found: ignore

      - name: Remover artefatos intermediários
        # Blobs e resultados brutos ja foram consolidados acima. Se algum passo anterior falhar,
        # este passo nao roda e os intermediarios ficam disponiveis para investigacao.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --paginate \
            --jq '.artifacts[] | select(.name | test("^(blob|allure-results)-")) | "\(.id) \(.name)"' |
          while read -r id nome; do
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id"
            echo "Removido: $nome"
          done

      - name: Preparar publicação do Allure
        id: preparar-publicacao
        # Publica apenas a suite completa da main, para o historico nao misturar execucoes parciais ou de PR.
        if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && env.TIPO_TESTE == 'todos' }}
        shell: bash
        run: |
          if [ -f allure-report/index.html ]; then
            echo "publicar=true" >> "$GITHUB_OUTPUT"
          else
            echo "Relatório Allure não encontrado; publicação ignorada."
          fi

      - name: Enviar relatório Allure para o GitHub Pages
        if: ${{ steps.preparar-publicacao.outputs.publicar == 'true' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: allure-report

  publicar-allure:
    name: 🚀 Publicar Allure
    needs: relatorios
    if: ${{ !cancelled() && needs.relatorios.outputs.publicar == 'true' }}
    runs-on: ubuntu-24.04

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    concurrency:
      group: github-pages
      cancel-in-progress: false

    steps:
      - name: Publicar no GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5

      - name: Adicionar link do Allure ao resumo
        shell: bash
        run: |
          echo "📊 **Relatório Allure publicado:** ${{ steps.deploy.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
