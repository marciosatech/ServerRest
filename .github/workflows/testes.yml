name: Testes automatizados

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      tipo_teste:
        description: 'Escolha o conjunto de testes que será executado'
        required: true
        default: todos
        type: choice
        options:
          - api
          - e2e
          - todos

# Permissao minima por padrao; cada job pede apenas o que precisa.
permissions:
  contents: read

concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: false

jobs:
  executar-testes:
    name: Executar testes ${{ inputs.tipo_teste || 'todos' }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: read

    outputs:
      publicar: ${{ steps.preparar-publicacao.outputs.publicar }}

    env:
      LOGIN_EMAIL: ${{ secrets.LOGIN_EMAIL }}
      LOGIN_PASSWORD: ${{ secrets.LOGIN_PASSWORD }}

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Instalar navegador do Playwright
        if: ${{ inputs.tipo_teste != 'api' }}
        run: npx playwright install --with-deps chromium

      - name: Validar tipos TypeScript
        run: npm run verificar:tipos

      - name: Executar testes selecionados
        id: executar-testes
        continue-on-error: true
        shell: bash
        run: |
          set +e
          tipo_teste="${{ inputs.tipo_teste || 'todos' }}"

          case "$tipo_teste" in
            api)
              npm run test:api
              ;;
            e2e)
              npm run test:e2e
              ;;
            todos)
              npm test
              ;;
            *)
              echo "Tipo de teste inválido: $tipo_teste"
              codigo_saida=1
              ;;
          esac

          if [ -z "${codigo_saida+x}" ]; then
            codigo_saida=$?
          fi
          echo "codigo_saida=$codigo_saida" >> "$GITHUB_OUTPUT"

      - name: Gerar resumo da execução
        if: ${{ always() }}
        run: npm run gerar:resumo

      - name: Obter endereço do GitHub Pages
        id: pages
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/configure-pages@v6

      - name: Gerar relatório Allure
        if: ${{ always() }}
        shell: bash
        env:
          URL_RELATORIO: ${{ steps.pages.outputs.base_url }}
        run: |
          mkdir -p allure-results/history

          # O historico vem do proprio relatorio publicado e alimenta as tendencias e o historico de cada teste.
          if [ -n "$URL_RELATORIO" ]; then
            for arquivo in history.json history-trend.json duration-trend.json categories-trend.json retry-trend.json; do
              curl -sfL "$URL_RELATORIO/history/$arquivo" -o "allure-results/history/$arquivo"                 || echo "Histórico $arquivo ainda não publicado."
            done
          fi

          cat > allure-results/executor.json <<EOF
          {
            "name": "GitHub Actions",
            "type": "github",
            "buildOrder": ${{ github.run_number }},
            "buildName": "Execução #${{ github.run_number }} (${{ inputs.tipo_teste || 'todos' }})",
            "buildUrl": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "reportUrl": "$URL_RELATORIO/",
            "reportName": "ServeRest - Automação de testes"
          }
          EOF

          npm run allure:gerar

      - name: Preparar publicação do Allure
        id: preparar-publicacao
        # Publica apenas a suite completa da main, para o historico nao misturar execucoes parciais ou de PR.
        if: ${{ always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && (inputs.tipo_teste || 'todos') == 'todos' }}
        shell: bash
        run: |
          if [ -f allure-report/index.html ]; then
            echo "publicar=true" >> "$GITHUB_OUTPUT"
          else
            echo "Relatório Allure não encontrado; publicação ignorada."
          fi

      - name: Enviar relatório Allure para o GitHub Pages
        if: ${{ always() && steps.preparar-publicacao.outputs.publicar == 'true' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: allure-report

      - name: Publicar relatório e evidências
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-${{ inputs.tipo_teste || 'todos' }}
          path: |
            playwright-report/
            allure-report/
            test-results/
          if-no-files-found: ignore

      - name: Falhar job se os testes falharem
        if: ${{ always() && steps.executar-testes.outputs.codigo_saida != '0' }}
        run: exit 1

  publicar-allure:
    name: Publicar relatório Allure
    needs: executar-testes
    # Roda mesmo com testes falhando: o relatorio e justamente onde as falhas sao analisadas.
    if: ${{ always() && needs.executar-testes.outputs.publicar == 'true' }}
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    concurrency:
      group: github-pages
      cancel-in-progress: false

    steps:
      - name: Publicar no GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5

      - name: Adicionar link do Allure ao resumo
        shell: bash
        run: |
          echo "📊 **Relatório Allure publicado:** ${{ steps.deploy.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
